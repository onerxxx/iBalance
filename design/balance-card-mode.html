<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>余额卡片模式 · 原型</title>
<style>
/* ============================================================
   余额卡片新模式原型
   变更点（相对当前卡片）：
   ① 进度条独占一行，向左延伸到主标题最左（= 图标列右侧内容区起点）
   ② 副标题下移到进度条下方
   ③ API + Agent 两板块共 6 张卡（Codex 默认隐藏，数据里可放开）
   ④ 卡内水平 padding 归 0：卡内容与板块标题/页脚左右对齐（面板级缩进 16+7 不变）
   页面右上可切换「新模式 / 当前样式(对照)」与「分组列表 / 两列网格」。
   数据都是演示假数据，改 script 顶部 DATA 数组即可。
   ============================================================ */

/* ---- 调参入口：与 App 现行规格同名同值，改这里即时生效 ---- */
:root {
  --panel-w: 240px;        /* 面板宽（App 定稿 240） */
  --panel-w-grid: 608px;   /* 两列网格态容器宽：原 304 再 +100% */
  --panel-inset: 4px;      /* 容器（面板）左右 padding：用户定稿 4（App 现行 contentHorizontalInset=16 仅旧模式） */
  --text-inset: 7px;       /* root 正文缩进 → 视觉 16+7=23 */
  --card-pad-h: 0px;       /* 卡内水平 padding：0 保证卡内容与板块标题/页脚左右对齐（各级内容左右对齐） */
  --card-pad-v: 7px;       /* 卡片上下 padding */
  --icon-col: 25px;        /* 图标列宽（= icon 等宽） */
  --icon-gap: 6.5px;       /* 图标列↔内容区间距 */
  --radius: 10px;          /* 卡片圆角 */
  --row1-h: 16px;          /* 标题行高 */
  --bar-h: 5.06px;         /* 进度条条高（原点阵口径） */
  --bar-slot: 14px;        /* 进度条行槽高（hover 子账号条 12px chip 需要容身，故 14） */
  --sub-h: 12px;           /* 副标题行高 */
  --gap-r1-bar: 1px;       /* 【新模式】标题行↔进度条 间距 */
  --gap-bar-sub: 0px;      /* 【新模式】进度条↔副标题 间距 */
  --value-w: 65px;         /* 数值列宽（App 固定 65） */

  --fg: #EBEBEB;                 /* cardForeground 深色 */
  --fg-dim: rgba(255,255,255,0.61);  /* 非当前账号（未用到，备查） */
  --secondary: #98989D;          /* systemGray 深色 */
  --bar-track: rgba(152,152,157,0.34);  /* dotsDim×trackAlpha 深色口径 */
  --bar-fill-a: rgba(64,156,255,0.30);  /* UsageDots 填充渐变左端 */
  --bar-fill-b: rgba(64,156,255,0.95);  /* 右端 */
  --hover-bg: rgba(0,0,0,0.40);  /* 平台卡 hover 强背景（App 为中心实色+边缘 5pt 渐隐，此处近似整卡） */
  --hover-border: rgba(255,255,255,0.18);
  --chip-bg: rgba(255,255,255,0.10);
  --chip-bg-hover: rgba(255,255,255,0.20);
}

/* 数值字体直接用仓库打包的同一份 TTF（App 内 Mono 策略 = JetBrainsMonoNL-SemiBold） */
@font-face {
  font-family: "JetBrains Mono NL";
  src: url("../swift/fonts/JetBrainsMonoNL-SemiBold.ttf") format("truetype");
  font-weight: 600;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background:
    radial-gradient(900px 600px at 15% 20%, rgba(58,88,180,0.28), transparent 60%),
    radial-gradient(800px 500px at 85% 75%, rgba(38,140,120,0.20), transparent 60%),
    radial-gradient(600px 400px at 70% 10%, rgba(120,60,150,0.16), transparent 60%),
    #101014;
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ============ 顶部工具条 ============ */
.toolbar {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 12px;
  background: rgba(28,28,32,0.72); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.seg { display: flex; background: rgba(255,255,255,0.06); border-radius: 7px; padding: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--secondary);
  font-size: 11px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
  font-family: inherit;
}
.seg button.on { background: rgba(255,255,255,0.14); color: var(--fg); }
.toolbar .lbl { font-size: 11px; color: var(--secondary); }

/* ============ 面板 ============ */
.stage { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 90px 20px 60px; }
.panel {
  width: var(--panel-w);
  border-radius: 20px;
  padding: 4px var(--panel-inset) 8px;
  /* 近似 App 容器：HUD 玻璃 + 顶部近黑→底部中灰渐变遮罩 */
  background:
    linear-gradient(180deg, rgba(0,0,0,0.50), rgba(120,120,120,0.28)),
    rgba(28,28,30,0.72);
  backdrop-filter: blur(36px) saturate(1.15);
  border: 1px solid rgba(255,255,255,0.09);
  box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
  transition: width 0.25s ease;
}
.panel-inner { padding: 0 var(--text-inset); }

.panel-header {
  height: 30px; display: flex; align-items: center; justify-content: space-between;
}
.panel-header .t { font-size: 13px; font-weight: 600; color: var(--secondary); }
.panel-header svg { width: 13px; height: 13px; color: var(--secondary); }

.section-title {
  height: 24px; display: flex; align-items: center;
  font-size: 13px; font-weight: 600; color: var(--secondary);
}
.section + .section { margin-top: 10px; }

.cards { display: flex; flex-direction: column; gap: 7px; }

.footer {
  margin-top: 10px; padding: 2px 0 4px;
  font-size: 9px; color: var(--secondary);
}

/* ============ 卡片 ============ */
.card {
  position: relative;
  display: flex; align-items: center;
  padding: var(--card-pad-v) var(--card-pad-h);
  border-radius: var(--radius);
  min-width: 0;
}
/* 平台卡 hover 强背景（近似：整卡纯色 + 内描边；App 另有边缘 5pt 渐隐） */
.card::after {
  content: ""; position: absolute; inset: 0; border-radius: var(--radius);
  background: var(--hover-bg);
  box-shadow: inset 0 0 0 0.8px var(--hover-border);
  opacity: 0; transition: opacity 0.15s ease;
  pointer-events: none;
}
.card:hover::after { opacity: 1; }
.card > * { position: relative; z-index: 1; }

.icon-col {
  flex: none; width: var(--icon-col);
  display: flex; align-items: center; justify-content: center;
  align-self: stretch;
}
.icon-col img { width: 25px; height: 25px; }

.content { flex: 1; min-width: 0; margin-left: var(--icon-gap); }

.row1 { display: flex; align-items: baseline; height: var(--row1-h); }
.title-row {
  flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px;
}
.title { font-size: 13px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nick  { font-size: 10px; color: var(--secondary); white-space: nowrap; flex: none;
         opacity: 0; transition: opacity 0.2s ease; }
.card:hover .nick { opacity: 1; }

.value {
  flex: none; width: var(--value-w); margin-right: -0.7px;  /* App：右锚 +0.7pt */
  display: flex; justify-content: flex-end; align-items: baseline; gap: 2px;
  font-family: "JetBrains Mono NL", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-weight: 600; font-size: 13px; color: var(--fg);
  white-space: nowrap;
}
.value .cur { font-size: 60%; }          /* ¥/$ 60% 字号富文本 */
.value .coin { width: 9px; height: 9px; flex: none; align-self: center; color: var(--fg); }

/* ---- 【新模式】进度条整行（左缘=主标题最左）+ 副标题下移 ---- */
.bar-row {
  position: relative;
  height: var(--bar-slot);
  margin-top: var(--gap-r1-bar);
  display: flex; align-items: center;
}
.bar { width: 100%; height: var(--bar-h); border-radius: calc(var(--bar-h) / 2);
       background: var(--bar-track); overflow: hidden; transition: opacity 0.15s ease; }
.bar .fill {
  height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--bar-fill-a), var(--bar-fill-b));
}
.card.pulsing .bar .fill { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

.sub-row {
  height: var(--sub-h);
  margin-top: var(--gap-bar-sub);
  display: flex; align-items: center;
}

/* ---- 【当前样式对照】副标题(左) + 窄进度条(右 45.54pt) 同行 ---- */
.row2c { position: relative; height: 12px; display: flex; align-items: center; }
.row2c .bar { width: 45.54px; flex: none; margin-left: auto; }

/* 副标题（两种模式共用内容结构） */
.sub { display: flex; align-items: center; gap: 3px; font-size: 9px; color: var(--secondary); min-width: 0; white-space: nowrap; overflow: hidden; }
.sub svg { width: 10px; height: 10px; flex: none; }
.row2c .sub { flex: 1; }

/* ---- hover 其余账号条（chip）：与进度条同槽互换 ---- */
.strip {
  position: absolute; inset: 0;
  display: flex; align-items: center; gap: 4px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
}
.row2c .strip { left: auto; justify-content: flex-end; }
/* 只有存在子账号条（has-strip）的卡才做互换，避免 Trae 等单号卡 hover 进度条凭空消失 */
.card.has-strip:hover .bar { opacity: 0; }
.card.has-strip:hover .strip { opacity: 1; }
.chip {
  flex: none; display: flex; align-items: center; gap: 3px;
  height: 12px; padding: 0 4px; border-radius: 3.5px;
  background: var(--chip-bg);
  font-size: 10px; color: var(--secondary); cursor: default;
}
.chip:hover { background: var(--chip-bg-hover); }
.chip svg { width: 8px; height: 8px; color: var(--secondary); }

/* ============ 模式切换 ============ */
/* 新模式：进度条行 + 副标题行 */
body.mode-new .bar-row, body.mode-new .sub-row { display: flex; }
body.mode-new .row2c { display: none; }
/* 当前样式对照：副标题+窄条同行 */
body.mode-cur .bar-row, body.mode-cur .sub-row { display: none; }
body.mode-cur .row2c { display: flex; }

/* 两列网格（附加预览）：面板大幅加宽后单卡空间充裕，数值列宽/昵称沿用列表态规格 */
body.layout-grid .panel { width: var(--panel-w-grid); }
body.layout-grid .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-items: stretch; }
</style>
</head>
<body class="mode-new layout-list">

<div class="toolbar">
  <span class="lbl">卡片</span>
  <div class="seg" id="segCard">
    <button data-v="mode-new" class="on">新模式</button>
    <button data-v="mode-cur">当前样式·对照</button>
  </div>
  <span class="lbl">排布</span>
  <div class="seg" id="segLayout">
    <button data-v="layout-list" class="on">分组列表</button>
    <button data-v="layout-grid">两列网格</button>
  </div>
</div>

<div class="stage">
  <div class="panel">
    <div class="panel-inner">
      <div class="panel-header">
        <span class="t">余额</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-.7 7.1 3.2 2.9H6.5l3.2-2.9L9 4z"/><path d="M12 14v6"/></svg>
      </div>

      <div class="section" id="secApi">
        <div class="section-title">API</div>
        <div class="cards"></div>
      </div>
      <div class="section" id="secAgent">
        <div class="section-title">Agent</div>
        <div class="cards"></div>
      </div>

      <div class="footer">更新于 14:32:08</div>
    </div>
  </div>
</div>

<script>
/* ---- 内联图标（取自 swift/icons/，描边改 currentColor 以跟随副标题灰） ---- */
const ICONS = {
  coin: '<svg viewBox="0 0 100 100" fill="currentColor"><path d="M64,42c-1.37,0-2.7.06-4,.18V28c0-8-10.32-14-24-14S12,20,12,28V60c0,8,10.32,14,24,14,1.44,0,2.83-.07,4.19-.2C41.61,80.87,51.37,86,64,86c13.68,0,24-6,24-14V56C88,48,77.68,42,64,42ZM80,56c0,2.12-6.07,6-16,6s-16-3.88-16-6,6.07-6,16-6S80,53.88,80,56ZM36,22c9.93,0,16,3.88,16,6s-6.07,6-16,6-16-3.88-16-6S26.07,22,36,22ZM20,38.6A35.72,35.72,0,0,0,36,42a35.72,35.72,0,0,0,16-3.4v5.16a20.84,20.84,0,0,0-9.31,5.6A33.82,33.82,0,0,1,36,50c-9.93,0-16-3.88-16-6V38.6ZM20,60V54.6A35.72,35.72,0,0,0,36,58c1.37,0,2.7-.07,4-.18v8A35.32,35.32,0,0,1,36,66C26.07,66,20,62.12,20,60ZM64,78c-9.93,0-16-3.88-16-6V66.6A35.72,35.72,0,0,0,64,70a35.72,35.72,0,0,0,16-3.4V72C80,74.12,73.93,78,64,78Z"/></svg>',
  'clock-m': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0 -9 9"/><path d="M12 7v5l1 1"/><path stroke-width="1.7" d="M15.38 22.14 L15.38 16.06 L19.45 20.48 L23.52 16.06 L23.52 22.14"/></svg>',
  'clock-w': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0 -9 9"/><path d="M12 7v5l1 1"/><path stroke-width="1.7" d="M15.24 16.06 L17.31 22.14 L19.45 18.0 L21.59 22.14 L23.66 16.06"/></svg>',
  'clock':   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0 -9 9"/><path d="M12 7v5l1 1"/><path d="M16 16h6v6h-6l0 -6"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5a1 1 0 0 1 0 2h-6a1 1 0 0 0 -1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1 -1v-6a1 1 0 0 1 2 0v6a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-10a3 3 0 0 1 3 -3zm3 -2h5l.075 .003l.126 .017l.111 .03l.111 .044l.098 .052l.096 .067l.09 .08q .054 .053 .097 .112l.071 .11l.054 .114l.035 .105l.03 .148l.006 .118v5a1 1 0 0 1 -2 0v-2.586l-7.293 7.293a1 1 0 0 1 -1.414 -1.414l7.291 -7.293h-2.584a1 1 0 0 1 0 -2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>',
};

/* ---- 演示数据（假数据；ratio = 剩余比例 = 1 - usedRatio） ----
   icon 直接引用仓库资产 ../swift/icons/，挪动本文件需同步改路径。
   Codex 默认不展示（合计 6 卡）；要加回去解开注释即可。 */
const DATA = [
  { section: 'api', platform: 'DeepSeek', icon: 'deepseek.png',
    cur: '¥', value: '23.4568', ratio: 0.62,
    subIcon: 'ext', segments: ['剩余', '5天', '08:12'] },
  { section: 'api', platform: 'ZhiPu', icon: 'zcode.png',
    cur: '¥', value: '128.50', ratio: 0.88,
    subIcon: 'ext', segments: ['剩余', '12天', '03:40'] },
  { section: 'api', platform: 'Qwen', icon: 'qwen.png',
    value: '86%', ratio: 0.86,
    subIcon: 'clock-w', segments: ['剩余', '2天', '11:05'] },

  { section: 'agent', platform: 'WorkBuddy', icon: 'workbuddy.png',
    coin: true, value: '1,234.5', ratio: 0.45, nick: '大号',
    subIcon: 'clock-m', segments: ['剩余', '20天', '09:14'],
    subs: ['320.0', '88.5'] },
  { section: 'agent', platform: 'Trae', icon: 'trae.png',
    coin: true, value: '86.2', ratio: 0.71,
    subIcon: 'x', segments: ['此平台不再维护'] },
  { section: 'agent', platform: 'ZCode', icon: 'zcode.png',
    coin: true, value: '532.8', ratio: 0.30, nick: '小号', pulsing: true,
    subIcon: 'clock', segments: ['剩余', '28天', '18:46'],
    subs: ['96.4'] },

  // { section: 'agent', platform: 'Codex', icon: 'codex.png',
  //   coin: true, value: '12.0', ratio: 0.10,
  //   subIcon: 'clock-m', segments: ['剩余', '9天', '06:30'] },
];

function subHTML(d) {
  const segs = d.segments.map(s => `<span>${s}</span>`).join('');
  return `<div class="sub">${ICONS[d.subIcon]}${segs}</div>`;
}
function stripHTML(d) {
  if (!d.subs || !d.subs.length) return '';
  const chips = d.subs.map(v =>
    `<span class="chip">${ICONS.coin}<span>${v}</span></span>`).join('');
  return `<div class="strip">${chips}</div>`;
}
function valueHTML(d) {
  const cur = d.cur ? `<span class="cur">${d.cur}</span>` : '';
  const coin = d.coin ? `${ICONS.coin.replace('<svg ', '<svg class="coin" ')}` : '';
  return `${coin}<span>${d.value}</span>`;
}
function cardHTML(d) {
  return `
  <div class="card ${d.section}${d.pulsing ? ' pulsing' : ''}${d.subs && d.subs.length ? ' has-strip' : ''}">
    <div class="icon-col"><img src="../swift/icons/${d.icon}" alt=""></div>
    <div class="content">
      <div class="row1">
        <div class="title-row">
          <span class="title">${d.platform}</span>
          ${d.nick ? `<span class="nick">${d.nick}</span>` : ''}
        </div>
        <div class="value">${valueHTML(d)}</div>
      </div>
      <!-- 新模式：进度条独占一行（左缘=主标题最左），hover 时子账号条同槽互换 -->
      <div class="bar-row">
        <div class="bar"><div class="fill" style="width:${(d.ratio * 100).toFixed(1)}%"></div></div>
        ${stripHTML(d)}
      </div>
      <!-- 新模式：副标题下移 -->
      <div class="sub-row">${subHTML(d)}</div>
      <!-- 当前样式对照：副标题(左) + 窄条(右) 同行 -->
      <div class="row2c">
        ${subHTML(d)}
        <div class="bar"><div class="fill" style="width:${(d.ratio * 100).toFixed(1)}%"></div></div>
        ${stripHTML(d)}
      </div>
    </div>
  </div>`;
}

document.querySelector('#secApi .cards').innerHTML =
  DATA.filter(d => d.section === 'api').map(cardHTML).join('');
document.querySelector('#secAgent .cards').innerHTML =
  DATA.filter(d => d.section === 'agent').map(cardHTML).join('');

/* ---- 工具条切换 ---- */
function bindSeg(id, apply) {
  const seg = document.getElementById(id);
  seg.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    apply(btn.dataset.v);
  });
}
bindSeg('segCard', v => {
  document.body.classList.toggle('mode-new', v === 'mode-new');
  document.body.classList.toggle('mode-cur', v === 'mode-cur');
});
bindSeg('segLayout', v => {
  document.body.classList.toggle('layout-list', v === 'layout-list');
  document.body.classList.toggle('layout-grid', v === 'layout-grid');
});
</script>
</body>
</html>
